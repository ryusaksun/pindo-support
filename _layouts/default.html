<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root { --text: #1d1d1f; --muted: #6e6e73; --bg: #fff; --line: #d2d2d7; --link: #0066cc; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #f5f5f7; --muted: #a1a1a6; --bg: #000; --line: #424245; --link: #2997ff; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    header, main, footer { max-width: 42rem; margin: 0 auto; padding: 0 1.25rem; }
    header { padding-top: 1.25rem; }
    header a { color: var(--muted); text-decoration: none; font-size: 15px; }
    h1 { font-size: 1.75rem; line-height: 1.3; margin: 1.25rem 0 0.5rem; }
    h2 { font-size: 1.25rem; line-height: 1.4; margin: 2.25rem 0 0.5rem; }
    h3 { font-size: 1.05rem; margin: 1.5rem 0 0.25rem; }
    p, li { margin: 0.5rem 0; }
    ul { padding-left: 1.25rem; }
    a { color: var(--link); }
    footer { margin: 3rem auto 2rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header><a href="{{ '/' | relative_url }}">拼豆码头</a></header>
  <main>
{{ content }}
  </main>
  <footer>
    <a href="{{ '/privacy/' | relative_url }}">隐私政策</a> · <a href="https://github.com/ryusaksun/pindo-support/issues">问题反馈</a>
  </footer>
</body>
</html>
