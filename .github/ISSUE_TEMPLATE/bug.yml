name: 问题反馈
description: 出错、闪退、识别不准、显示不对
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 这里公开可见，请不要填写手机号、邮箱或其他敏感信息。
  - type: dropdown
    id: area
    attributes:
      label: 哪一部分
      options:
        - 导入和识别图纸
        - 图纸编辑
        - 拼豆模式
        - 库存
        - 作品集
        - 主屏幕小组件
        - 我的
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 遇到的问题，以及你原本期待的样子
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎么出现的
      description: 按顺序写下操作步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: 截图、录屏或原图
      description: 识别不准时，附上图纸原图或小红书笔记链接最有帮助。图片可以直接拖进来
  - type: input
    id: device
    attributes:
      label: 设备和系统
      placeholder: iPhone 17 Pro，iOS 27.0.1
  - type: input
    id: version
    attributes:
      label: 拼豆码头版本
      description: 在「我的」→「关于」里查看
  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率
      options:
        - 每次都会
        - 偶尔出现
        - 只出现过一次
